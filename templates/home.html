<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Indicator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #e7f0ff 0%, #f8fbff 45%, #fff3e0 100%);
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .page {
            width: min(920px, 100%);
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 24px 70px rgba(31, 41, 55, 0.16);
            overflow: hidden;
        }

        .intro {
            background: linear-gradient(160deg, #2563eb, #14b8a6);
            color: #ffffff;
            padding: 44px 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
        }

        .intro h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.05;
            letter-spacing: 0;
        }

        .intro p {
            font-size: 1rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-panel {
            padding: 40px 36px;
        }

        .form-panel h2 {
            margin-bottom: 24px;
            font-size: clamp(1.5rem, 3vw, 2rem);
            color: #111827;
        }

        form {
            display: grid;
            gap: 16px;
        }

        .field {
            display: grid;
            gap: 7px;
        }

        label {
            font-size: 0.92rem;
            font-weight: 700;
            color: #374151;
        }

        select,
        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #f9fafb;
            color: #111827;
            font-size: 0.95rem;
            padding: 10px 12px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        select:focus,
        input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.13);
        }

        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            min-height: 48px;
            margin-top: 8px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 16px 28px rgba(37, 99, 235, 0.3);
        }

        .result {
            margin-top: 22px;
            padding: 14px 16px;
            border-radius: 8px;
            background: #ecfdf5;
            color: #065f46;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
        }

        @media (max-width: 760px) {
            .page {
                grid-template-columns: 1fr;
            }

            .intro,
            .form-panel {
                padding: 30px 22px;
            }

            .score-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="intro">
            <h1>Student Exam Performance Indicator</h1>
            <p>Enter the student's background and exam details to predict the maths score.</p>
        </section>

        <section class="form-panel">
            <h2>Student Exam Performance Prediction</h2>

            <form action="{{ url_for('predict_datapoint') }}" method="post">
                <div class="field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected>Select your Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="field">
                    <label for="race_ethnicity">Race or Ethnicity</label>
                    <select id="race_ethnicity" name="race_ethnicity" required>
                        <option value="" disabled selected>Select Ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div class="field">
                    <label for="parental_level_of_education">Parental Level of Education</label>
                    <select id="parental_level_of_education" name="parental_level_of_education" required>
                        <option value="" disabled selected>Select Parent Education</option>
                        <option value="some high school">Some High School</option>
                        <option value="high school">High School</option>
                        <option value="some college">Some College</option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="master's degree">Master's Degree</option>
                    </select>
                </div>

                <div class="field">
                    <label for="lunch">Lunch Type</label>
                    <select id="lunch" name="lunch" required>
                        <option value="" disabled selected>Select Lunch Type</option>
                        <option value="standard">Standard</option>
                        <option value="free/reduced">Free/Reduced</option>
                    </select>
                </div>

                <div class="field">
                    <label for="test_preparation_course">Test Preparation Course</label>
                    <select id="test_preparation_course" name="test_preparation_course" required>
                        <option value="" disabled selected>Select Test Course</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="score-grid">
                    <div class="field">
                        <label for="writing_score">Writing Score out of 100</label>
                        <input id="writing_score" name="writing_score" type="number" min="0" max="100" placeholder="Enter writing score" required>
                    </div>

                    <div class="field">
                        <label for="reading_score">Reading Score out of 100</label>
                        <input id="reading_score" name="reading_score" type="number" min="0" max="100" placeholder="Enter reading score" required>
                    </div>
                </div>

                <button type="submit">Predict your Maths Score</button>
            </form>

            {% if results %}
                <div class="result">The prediction is {{ results }}</div>
            {% endif %}
        </section>
    </main>
</body>
</html>
